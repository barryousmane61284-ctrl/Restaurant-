<!-- ================================================================= -->
<!-- PAGE DE CONNEXION AU RESTAURANT -->
<!-- ================================================================= -->
<div class="login-wrapper">
  <div class="login-card">
    <!-- En-tête avec icône du restaurant -->
    <div class="login-header">
      <div class="logo-circle">
        <i class='bx bxs-restaurant'></i>
      </div>
      <h2>Espace Restaurant</h2>
      <p>Connectez-vous pour gérer les commandes, plats et factures</p>
    </div>

    <!-- BANDEAU COMPTE À REBOURS : Affiché en cas de blocage Rate-Limit -->
    <div class="countdown-card" *ngIf="secondesRestantes > 0">
      <div class="countdown-icon-box">
        <i class='bx bx-time-five bx-tada'></i>
      </div>
      <div class="countdown-body">
        <h4>Compte temporairement bloqué</h4>
        <p>Trop de tentatives échouées. Réessayez dans :</p>
        <div class="countdown-badge">
          <span>{{ tempsFormate }}</span>
        </div>
      </div>
    </div>

    <!-- Message de déblocage vert -->
    <div class="alert-success" *ngIf="messageDebloque && secondesRestantes === 0">
      <i class='bx bx-check-circle'></i>
      <span>{{ messageDebloque }}</span>
    </div>

    <!-- Message d'alerte rouge standard (si non bloqué) -->
    <div class="alert-error" *ngIf="messageErreur && secondesRestantes === 0">
      <i class='bx bx-error-circle'></i>
      <span>{{ messageErreur }}</span>
    </div>

    <!-- Formulaire de connexion : appelle la fonction seConnecter() au submit -->
    <form (ngSubmit)="seConnecter()" class="login-form">
      <!-- Champ 1 : Adresse Email -->
      <div class="form-group">
        <label class="form-label" for="email">Adresse Email</label>
        <div class="input-with-icon">
          <i class='bx bx-envelope'></i>
          <input 
            type="email" 
            id="email" 
            class="form-control" 
            placeholder="ex: admin@restaurant.com" 
            [(ngModel)]="email" 
            name="email" 
            [disabled]="secondesRestantes > 0"
            required>
        </div>
      </div>

      <!-- Champ 2 : Mot de passe -->
      <div class="form-group">
        <label class="form-label" for="motDePasse">Mot de passe</label>
        <div class="input-with-icon">
          <i class='bx bx-lock-alt'></i>
          <input 
            [type]="motDePasseVisible ? 'text' : 'password'" 
            id="motDePasse" 
            class="form-control has-toggle" 
            placeholder="••••••••" 
            [(ngModel)]="motDePasse" 
            name="motDePasse" 
            [disabled]="secondesRestantes > 0"
            required>
          <button 
            type="button" 
            class="btn-eye-toggle" 
            (click)="basculerVisibiliteMotDePasse()" 
            tabindex="-1"
            [disabled]="secondesRestantes > 0"
            title="{{ motDePasseVisible ? 'Masquer le mot de passe' : 'Afficher le mot de passe' }}">
            <i class='bx' [class.bx-show]="!motDePasseVisible" [class.bx-hide]="motDePasseVisible"></i>
          </button>
        </div>
      </div>

      <!-- Bouton de validation : désactivé pendant le chargement ou le décompte -->
      <button 
        type="submit" 
        class="btn btn-primary btn-block" 
        [class.btn-blocked]="secondesRestantes > 0"
        [disabled]="chargement || secondesRestantes > 0">
        <span *ngIf="!chargement && secondesRestantes === 0">Se connecter</span>
        <span *ngIf="secondesRestantes > 0" class="btn-timer-text">
          <i class='bx bx-lock'></i> Réessayez dans {{ tempsFormate }}
        </span>
        <span *ngIf="chargement" class="loader-text">
          <i class='bx bx-loader-alt bx-spin'></i> Connexion en cours...
        </span>
      </button>
    </form>

    <div class="login-footer">
      <p>Accès réservé aux employés : <strong>Admin, Serveur, Caissier</strong></p>
    </div>
  </div>
</div>
