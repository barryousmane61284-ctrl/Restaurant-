<!-- ================================================================= -->
<!-- PAGE DE CONNEXION AU RESTAURANT -->
<!-- ================================================================= -->
<div class="login-wrapper">
  <div class="login-card">
    <!-- En-tête avec icône du restaurant -->
    <div class="login-header">
      <div class="logo-circle">
        <i class='bx bxs-restaurant'></i>
      </div>
      <h2>Espace Restaurant</h2>
      <p>Connectez-vous pour gérer les commandes, plats et factures</p>
    </div>

    <!-- Message d'alerte rouge affiché en cas d'erreur de saisie -->
    <div class="alert-error" *ngIf="messageErreur">
      <i class='bx bx-error-circle'></i>
      <span>{{ messageErreur }}</span>
    </div>

    <!-- Formulaire de connexion : appelle la fonction seConnecter() au submit -->
    <form (ngSubmit)="seConnecter()" class="login-form">
      <!-- Champ 1 : Adresse Email -->
      <div class="form-group">
        <label class="form-label" for="email">Adresse Email</label>
        <div class="input-with-icon">
          <i class='bx bx-envelope'></i>
          <!-- [(ngModel)] lie directement ce champ à la variable "email" dans le fichier TS -->
          <input 
            type="email" 
            id="email" 
            class="form-control" 
            placeholder="ex: admin@restaurant.com" 
            [(ngModel)]="email" 
            name="email" 
            required>
        </div>
      </div>

      <!-- Champ 2 : Mot de passe -->
      <div class="form-group">
        <label class="form-label" for="motDePasse">Mot de passe</label>
        <div class="input-with-icon">
          <i class='bx bx-lock-alt'></i>
          <!-- [(ngModel)] lie ce champ à la variable "motDePasse" dans le fichier TS -->
          <input 
            [type]="motDePasseVisible ? 'text' : 'password'" 
            id="motDePasse" 
            class="form-control has-toggle" 
            placeholder="••••••••" 
            [(ngModel)]="motDePasse" 
            name="motDePasse" 
            required>
          <button 
            type="button" 
            class="btn-eye-toggle" 
            (click)="basculerVisibiliteMotDePasse()" 
            tabindex="-1"
            title="{{ motDePasseVisible ? 'Masquer le mot de passe' : 'Afficher le mot de passe' }}">
            <i class='bx' [class.bx-show]="!motDePasseVisible" [class.bx-hide]="motDePasseVisible"></i>
          </button>
        </div>
      </div>

      <!-- Bouton de validation : désactivé pendant le chargement -->
      <button type="submit" class="btn btn-primary btn-block" [disabled]="chargement">
        <span *ngIf="!chargement">Se connecter</span>
        <span *ngIf="chargement" class="loader-text">
          <i class='bx bx-loader-alt bx-spin'></i> Connexion en cours...
        </span>
      </button>
    </form>

    <div class="login-footer">
      <p>Accès réservé aux employés : <strong>Admin, Serveur, Caissier</strong></p>
    </div>
  </div>
</div>
